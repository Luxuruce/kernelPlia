conflicts:
- id: C2_art29_pallet_wrap_exemption
  clause_ids:
  - dec_2026_429/art/1
  - ppwr/art/29/1
  - ppwr/art/29/2
  - ppwr/art/29/3
  - ppwr_guidance/sec/19
  summary_zh: '托盘缠绕膜与捆扎带的 100% 重复使用义务已被豁免，但官方实施指南未反映：

    Delegated Decision (EU) 2026/429（2026-02-25 通过，OJ 2026-05-06 刊发，2026-05-26 生效）

    依第 29(18)(a) 条豁免了第 29(2)、(3) 条；而 2026-06-10 刊发的官方实施指南

    **第 18、19、20 节均未提及该豁免**——第 19 节全文引用第 29(1)(2)(3) 三款，

    第 18、20 节引用第 29(1) 条，三节的引文中都含 `pallet wrappings or straps`。

    '
  resolution_zh: '**以授权决定为准：使用托盘缠绕膜与捆扎带的经营者已豁免第 29(2)、(3) 条。**


    但**第 29(1) 条的 40% 总体目标仍然适用**——委员会通过版 C(2026) 511 final 序言 (2) 末句

    曾称 40% 配额对该等用途亦不适用，**该句在 OJ 正式刊发版中已删除**，以 OJ 版为准。


    **注意这与第 29(4) 条的法定排除不是一回事，不要混成一句「有豁免」**：

    第 29(4) 条把四类包装（危险货物运输、定制大型机械设备、与食品饲料直接接触的柔性包装、

    **纸板箱**）整体排除在第 1、2、3 款之外，**连 40% 都不适用**；

    而本条授权决定只免第 (2)(3) 款、40% 照旧。托盘缠绕膜与捆扎带不属第 29(4) 条那四类。

    '
  authority_basis: '位阶 2（授权法案，依 TFEU 第 290 条通过，有法律约束力，可增设法规正文没有的豁免）

    高于位阶 3（官方实施指南）。规范 5.2。指南属**失载**而非相反表述，时间上也在决定生效之后，

    不构成对豁免的否定。

    '
  trigger_clause_ids:
  - ppwr/art/29/1
  - ppwr/art/29/2
  - ppwr/art/29/3
