meta:
  drafted_by: 产品侧审核对话（claude-opus-5 起草）
  drafted_at: '2026-09-06'
  status: adopted
  adopted_by: '产品侧，2026-09-06。owner 授权建表，**逐词未经 owner 复核**。

    与 `conflicts.yaml` 的 `trigger_threshold: 10.0` 同性质——受控检索参数，

    不是规范断言，不走红线第 2 条的具名采纳流程；但改动同样须回归（见第 5 节）。

    '
  consumed_by: kernel/app/terms.py（提问侧候选词生成）
  depends_on:
    trigger_threshold: 10.0
    field_weights:
      heading: 3.0
      text_zh: 2.0
      text_en: 1.5
    tokenizer: jieba + 相邻词滑窗（2026-09-06 起，此前为字符 n-gram）
  depends_on_note: '**阈值或字段权重一旦变动，本表须重新审视。** 下面「哪些词长度才够越闸」的算术

    直接建立在 10.0 与 3.0/2.0/1.5 之上，换了数字，收录边界就不一样了。

    '
rule: "## 1. 剪除语义：整词命中才丢，与虚词剪枝同一条纪律\n\n一个候选词**整体**等于表中某一项时丢弃；**作为多词窗口的一部分时不受影响**。\n\n    「PPWR」      \
  \      → 丢\n    「PPWR 第 67(5) 条」 → 不丢（整词不等于 PPWR）\n    「包装」            → 不丢（不在表内）\n    「运输包装」      \
  \   → 不丢\n\n与 2026-09-06 虚词剪枝从「按字」改「按词」是同一条纪律：**整词判定，不看片段。**\n按片段剪会误伤「可回收性」「可重复使用」这类以虚词起头的领域词（G12 召回曾一度归零）。\n\
  \n**只在提问侧剪。** 语料文本一个字不动——`text_zh` 是译文正本，`text_en` 是作准文本。\n\n## 2. 收录判据：两把钥匙都要对上\n\n| | 判据 | 怎么验 |\n\
  |---|---|---|\n| **语义** | 该词指代**整部法规或语料本身**，或是**纯引用样板语** | 人工判断，须写进 `why` |\n| **实证** | 高频出现且**不独占任何议题**——命中它的单元横跨互不相干的话题\
  \ | 统计命中单元数与分布 |\n\n**两条都满足才收。** 只满足实证的一律不收——见第 4 节 `never_stopword`：\n`重复使用` 命中 15% 的单元、最高分 15.8，`可回收`\
  \ 命中 11%、最高分 11.2，\n两个都远超闸门，但它们**各自独占一个议题**（第 29 条重复使用目标、第 6 条可回收性），\n收进来就是把 C2 的阻断和第 6 条的召回一起废掉。\n\n\
  ## 3. 为什么这是人工表，不是 idf\n\n按文档频率自动算权重（idf）我们已经明确否掉：**语料一长，阻断行为就会跟着漂**，\n而阻断是红线级的确定性要求，不能随索引规模变。\n\n本表是**人工维护、具名采纳、改动须回归**的那一版「idf」——\n\
  它的值不随语料增长自动变化，只在有人写进这份文件时才变。**这是特性，不是省事。**\n\n## 4. 长度门槛（当前阈值 10.0 下）\n\n单个词要越过 10.0 闸门所需的最短长度：\n\n\
  | 字段 | 权重 | 最短 | 该长度得分 |\n|---|---|---|---|\n| `heading` | 3.0 | **3 字** | 3^1.2 × 3.0 = 11.21 |\n|\
  \ `text_zh` | 2.0 | **4 字** | 4^1.2 × 2.0 = 10.56 |\n| `text_en` | 1.5 | **5 字符** | 5^1.2 × 1.5 = 10.35\
  \ |\n\n短于此的词**越不过闸门**，但**仍然参与召回**——所以长度不是收录的门槛，\n只是判断「这条会不会造成误阻断」的依据。\n\n## 5. 改动纪律\n\n改这份表（增、删、改）**必须**：\n\
  \n1. 复跑 15 条黄金用例，记录**冲突判定**与**期望引用丢失数**的前后对照；\n2. 在 `changelog` 里写清动了哪个词、为什么、前后对照是多少；\n3. **不得用本表去修单条误触发。**\
  \ 一条用例误触发，先查是哪个词、那个词是否真的\n   无区分度；若它有区分度，就该改 `trigger_context_terms` 或条款 heading，不是把它停用。\n\n**删词与加词的危险方向不同**：加错一个有区分度的词\
  \ → **漏召回、漏阻断**，静默且方向危险；\n删掉一个该停的词 → 误阻断，有确定性兜底。所以**宁可少收，不可错收**。\n"
stopwords_zh:
- term: PPWR
  why: '**整个语料的名字。** 它出现在用户提问里几乎是无条件的——那是卖家唯一知道的名称——

    因此不携带任何区分信息。

    '
  evidence: '命中 13 / 164 个已采纳单元。在 `ppwr_guidance/sec/16` 的 text_zh 里得

    4^1.2 × 2.0 = **10.56 分，正好越过 10.0 闸门**，于是**任何写了 PPWR 的提问

    都会被 C1 的第 67(5) 条 XPS 适用日冲突拦下**。

    G10「我们做的是速冻食品包装袋，要不要做 PPWR？」的 10.56 分就是这么来的。

    同一个数在 `clauses.support.yaml` 第 393 行有记载——加固前 C1 在 G03 上也是 10.56，

    「命中它的词只有一个——译文里的 PPWR 四个字母」。

    '
  expected_effect: 'C1 在 G10 上的自足分数由 10.56 降至 5 分以下（不再有 4 字命中）；

    **G03 不受影响**——它靠的是加固后 heading 里的「什么时候」，15.83 分。

    '
- term: 本条例
  why: 法规对自身的代称，等价于 PPWR。
  evidence: 命中 33 / 164 个单元（20%），横跨全部议题。heading 出现时 3^1.2 × 3.0 = 11.21，越闸。
- term: 该条例
  why: 同上，另一种代称。
  evidence: 命中 1 / 164。text_zh 权重下 7.47 分，越不过闸门；收录是为口径一致。
- term: 包装法
  why: 中文语境里对 PPWR 最常见的俗称，用户提问高频、语料零区分度。
  evidence: 当前语料 0 命中——**这条现在是空转的**。
- term: 包装法规
  why: 同上。
  evidence: 当前语料 0 命中。
- term: 欧盟包装法
  why: 同上。
  evidence: 当前语料 0 命中。
stopwords_en:
- term: packaging
  why: 整个语料的主题词，也是每一条的样板语，不独占任何议题。
  evidence: 命中 23 / 30 个可回填单元（77%）。9^1.2 × 1.5 = **20.95 分，两倍于闸门**。
- term: Packaging
  why: 同上，句首形态。
  evidence: 命中 3 / 30。20.95 分。
- term: Article
  why: 纯引用样板语。每一条互引都写它，指向的条号才是信息。
  evidence: 命中 24 / 30（80%）。7^1.2 × 1.5 = 15.50 分。
- term: Regulation
  why: 指代整部法规本身。
  evidence: 命中 13 / 30（43%）。10^1.2 × 1.5 = 23.77 分。
- term: regulation
  why: 同上，小写形态。
  evidence: 命中 1 / 30。23.77 分。
- term: Commission
  why: 文件署名方，出现在几乎所有指南与 FAQ 单元，不指向任何议题。
  evidence: 命中 14 / 30（47%）。23.77 分。
never_stopword:
- term: 重复使用
  hit: 25/164 (15%)
  score: 15.8
  reason: 第 29 条重复使用目标的主题词，也是 **C2 阻断**的依据。停用即漏阻断。
- term: 可回收
  hit: 18/164 (11%)
  score: 11.2
  reason: 第 6 条与附件 II 的主题词。
- term: 重金属
  hit: 7/164 (4%)
  score: 11.2
  reason: 第 5(4) 条主题词，第 5 条问答的核心入口。
- term: 一次性塑料
  hit: 4/164 (2%)
  score: 20.7
  reason: '**C1 的议题词**，指向第 67(5) 条与 SUPD。'
- term: 包装
  hit: 近乎全部
  score: 4.59
  reason: 领域主词，参与几乎所有有区分度的复合词（食品包装、运输包装、复合包装）。整词命中才丢的规则下，它单独出现只贡献一层平坦底噪，越不过闸门，**不值得为此冒漏召的风险**。
- term: Directive
  hit: 4/30 (13%)
  score: 20.9
  reason: 指令与条例的区分是 C1 的实质内容，**有区分度**。
- term: manufacturer
  hit: 9/30 (30%)
  score: 29.6
  reason: 第 15 条制造商义务是两条义务链之一，是我们要打的差异点。频次高但强区分。
